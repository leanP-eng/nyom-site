<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le soin — NYOM</title><link rel="stylesheet" href="/css/site.css"></head><body><header><div class="wrap nav"><a href="/" class="wordmark" data-brand-name>NYOM</a><nav class="navlinks"><a href="/">Accueil</a><a href="/soin.html">Le soin</a><a href="/rendez-vous.html" class="btn">Rendez-vous</a></nav></div></header><div class="logo-band"><img data-logo src="/assets/logo.png" alt="Logo"></div><section><div class="wrap grid-2"><div class="care-image"><img id="care-image" alt="Espace de soin"></div><div><div class="kicker" style="color:var(--accent)">Le soin</div><h2 id="care-title"></h2><div class="audio-box" id="audio-box"><strong id="audio-label"></strong><audio id="care-audio" controls preload="metadata"></audio><small>Audio de 2 minutes maximum</small></div><div class="steps" id="steps"></div></div></div></section><section class="credentials"><div class="wrap"><strong data-credentials-label></strong><span data-credentials-details></span></div></section><footer><div class="wrap foot"><div><strong data-brand-name></strong><br><span data-tagline></span></div><div><a href="/rendez-vous.html"><strong>Prendre rendez-vous →</strong></a></div></div></footer><script src="/js/site.js"></script><script>document.addEventListener('siteconfigready',e=>{const c=e.detail.care||{};document.getElementById('care-title').textContent=c.title||'';document.getElementById('care-image').src=c.image||'';document.getElementById('audio-label').textContent=c.audioLabel||'';const a=document.getElementById('care-audio');if(c.audio)a.src=c.audio;else document.getElementById('audio-box').style.display='none';const s=document.getElementById('steps');(c.steps||[]).forEach(x=>{const d=document.createElement('div');d.className='step';d.innerHTML=`<h3>${x.title}</h3><p>${x.text}</p>`;s.appendChild(d)})})</script></body></html>
